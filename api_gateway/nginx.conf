user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==================== LOGGING ====================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # ==================== PERFORMANCE OPTIMIZATION ====================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    server_tokens off;

    # ==================== GZIP COMPRESSION ====================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # ==================== RATE LIMITING ZONES ====================
    limit_req_zone $binary_remote_addr zone=general_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=search_api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=upload_strict:10m rate=2r/m;
    limit_req_zone $binary_remote_addr zone=ai_processing:10m rate=20r/m;

    # ==================== UPSTREAM BACKENDS ====================
    upstream core_services {
        least_conn;
        server core_services:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream ai_processing {
        least_conn;
        server ai_processing:8001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ==================== MAIN API GATEWAY SERVER ====================
    server {
        listen 80;
        server_name _;

        # ==================== SECURITY HEADERS ====================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ==================== HEALTH CHECK ====================
        location /health {
            access_log off;
            return 200 '{"status": "ok", "service": "api_gateway", "timestamp": "$msec"}\n';
            add_header Content-Type application/json;
        }

        # ==================== DOCUMENTATION ENDPOINTS ====================
        location /docs {
            proxy_pass http://core_services;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /redoc {
            proxy_pass http://core_services;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /openapi.json {
            proxy_pass http://core_services;
            proxy_set_header Host $host;
        }

        # ==================== API V1 - CORE SERVICES ====================
        # Routes: /api/cv, /api/jobs, /api/recommend, /api/auth
        location /api/v1/ {
            limit_req zone=general_api burst=20 nodelay;

            proxy_pass http://core_services;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # Error handling
            proxy_intercept_errors on;
            error_page 502 503 504 /error.json;
        }

        # ==================== API - AI PROCESSING ====================
        # Routes: /api/process/cv, /api/process/job, /api/embed
        location /api/ai/ {
            limit_req zone=ai_processing burst=10 nodelay;

            rewrite ^/api/ai/(.*)$ /$1 break;

            proxy_pass http://ai_processing;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Longer timeouts for AI processing
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 180s;
        }

        # ==================== FILE UPLOAD ENDPOINTS ====================
        # Special handling for CV and Job uploads
        location ~ ^/api/v1/(cv|jobs)/upload {
            limit_req zone=upload_strict burst=3 nodelay;

            proxy_pass http://core_services;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Large timeouts for file uploads
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ==================== AUTHENTICATION ENDPOINTS ====================
        # Stricter rate limiting for auth
        location ~ ^/api/v1/auth/(login|register) {
            limit_req zone=auth_strict burst=5 nodelay;

            proxy_pass http://core_services;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 20s;
            proxy_send_timeout 20s;
            proxy_read_timeout 20s;
        }

        # ==================== SEARCH ENDPOINTS ====================
        # Higher rate limit for search
        location ~ ^/api/v1/(jobs|cv)/search {
            limit_req zone=search_api burst=50 nodelay;

            proxy_pass http://core_services;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ==================== ROOT & FALLBACK ====================
        location / {
            return 301 /health;
        }

        # ==================== ERROR PAGES ====================
        location = /error.json {
            internal;
            default_type application/json;
            return 503 '{"error": "Service Unavailable", "message": "Backend service is currently unavailable", "timestamp": "$msec"}';
        }

        # ==================== DENY SENSITIVE FILES ====================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
